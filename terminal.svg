    .cursor { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <rect x=".5" y=".5" width="459" height="319" rx="12" fill="#0d1117" stroke="#21262d"/>
