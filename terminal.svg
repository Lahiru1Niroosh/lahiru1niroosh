<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="460" height="320" viewBox="0 0 460 320" fill="none">
  <style>
    text { white-space: pre; font: 400 13px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; }
