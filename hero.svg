<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <style>
    .name { font: 700 42px 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: .5px; }
    .role { font: 600 17px 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; fill: #48cae4; letter-spacing: 2px; }
    .desc { font: 400 15px 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .chip { font: 600 11px 'JetBrains Mono', Consolas, Menlo, monospace; fill: #90e0ef; letter-spacing: 1.5px; }
    .tiny { font: 600 10px 'JetBrains Mono', Consolas, Menlo, monospace; fill: #6e7681; letter-spacing: 1.5px; }

    .grid  { animation: drift 12s linear infinite; }
    @keyframes drift { to { transform: translate(40px, 40px) } }

    .bar   { transform-box: fill-box; transform-origin: bottom; animation: grow 2.4s ease-in-out infinite; }
    .b1{animation-delay:0s} .b2{animation-delay:.3s} .b3{animation-delay:.6s} .b4{animation-delay:.9s} .b5{animation-delay:1.2s}
    @keyframes grow { 0%,100% { transform: scaleY(.45) } 50% { transform: scaleY(1) } }

    .line  { stroke-dasharray: 260; animation: draw 4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 260 } 60%,100% { stroke-dashoffset: 0 } }

    .src   { animation: blink 2.4s ease-in-out infinite; }
    .s1{animation-delay:0s} .s2{animation-delay:.5s} .s3{animation-delay:1s} .s4{animation-delay:1.5s} .s5{animation-delay:2s}
    @keyframes blink { 0%,100% { fill-opacity: .35 } 20% { fill-opacity: 1 } }

    .wire  { stroke-dasharray: 3 7; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20 } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020917"/>
      <stop offset=".55" stop-color="#06182c"/>
      <stop offset="1" stop-color="#0a2744"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00b4d8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pkt">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#48cae4"/>
      <stop offset="1" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyl" x1="0" x2="1">
      <stop offset="0" stop-color="#0a2744"/>
      <stop offset=".5" stop-color="#0e6ba8"/>
      <stop offset="1" stop-color="#0a2744"/>
    </linearGradient>
    <linearGradient id="barg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e6ba8"/>
      <stop offset="1" stop-color="#48cae4"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#020917" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#020917" stop-opacity=".6"/>
      <stop offset="1" stop-color="#020917" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" stroke="#00b4d8" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="420" rx="18"/></clipPath>

    <!-- Paths: sources → core, core → outputs -->
    <path id="i1" d="M690 92  C 780 92, 800 190, 880 205"/>
    <path id="i2" d="M690 152 C 770 152, 810 200, 880 210"/>
    <path id="i3" d="M690 212 C 760 212, 820 214, 880 214"/>
    <path id="i4" d="M690 272 C 770 272, 810 228, 880 218"/>
    <path id="i5" d="M690 332 C 780 332, 800 236, 880 223"/>
    <path id="o1" d="M960 200 C 1000 200, 1010 128, 1040 128"/>
    <path id="o2" d="M960 228 C 1000 228, 1010 300, 1040 300"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <g class="grid"><rect x="-40" y="-40" width="1300" height="520" fill="url(#gp)"/></g>

    <!-- ═════════ RIGHT: ANIMATED DATA PLATFORM ═════════ -->

    <!-- Sources -->
    <g>
      <rect class="src s1" x="660" y="80"  width="30" height="24" rx="6" fill="#00b4d8" stroke="#48cae4"/>
      <rect class="src s2" x="660" y="140" width="30" height="24" rx="6" fill="#00b4d8" stroke="#48cae4"/>
      <rect class="src s3" x="660" y="200" width="30" height="24" rx="6" fill="#00b4d8" stroke="#48cae4"/>
      <rect class="src s4" x="660" y="260" width="30" height="24" rx="6" fill="#00b4d8" stroke="#48cae4"/>
      <rect class="src s5" x="660" y="320" width="30" height="24" rx="6" fill="#00b4d8" stroke="#48cae4"/>
      <text class="tiny" x="675" y="372" text-anchor="middle">SOURCES</text>
    </g>

    <!-- Wires -->
    <g stroke="#00b4d8" stroke-opacity=".45" stroke-width="1.2">
      <use href="#i1" class="wire"/><use href="#i2" class="wire"/><use href="#i3" class="wire"/>
      <use href="#i4" class="wire"/><use href="#i5" class="wire"/>
      <use href="#o1" class="wire"/><use href="#o2" class="wire"/>
    </g>

    <!-- Packets in -->
    <g fill="url(#pkt)">
      <circle r="5"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#i1"/></animateMotion></circle>
      <circle r="5"><animateMotion dur="2.2s" begin=".45s" repeatCount="indefinite"><mpath href="#i2"/></animateMotion></circle>
      <circle r="5"><animateMotion dur="2.2s" begin=".9s" repeatCount="indefinite"><mpath href="#i3"/></animateMotion></circle>
      <circle r="5"><animateMotion dur="2.2s" begin="1.35s" repeatCount="indefinite"><mpath href="#i4"/></animateMotion></circle>
      <circle r="5"><animateMotion dur="2.2s" begin="1.8s" repeatCount="indefinite"><mpath href="#i5"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#i1"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.2s" begin="2s" repeatCount="indefinite"><mpath href="#i3"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.2s" begin=".2s" repeatCount="indefinite"><mpath href="#i5"/></animateMotion></circle>
      <!-- Packets out -->
      <circle r="5"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion></circle>
      <circle r="5"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle>
    </g>

    <!-- Core: halo + orbit rings + database -->
    <circle cx="920" cy="214" r="110" fill="url(#halo)">
      <animate attributeName="r" values="95;120;95" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g>
      <ellipse cx="920" cy="214" rx="78" ry="78" stroke="#00b4d8" stroke-opacity=".35" stroke-dasharray="2 10"/>
      <animateTransform attributeName="transform" type="rotate" from="0 920 214" to="360 920 214" dur="24s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="920" cy="214" rx="62" ry="62" stroke="#48cae4" stroke-opacity=".5" stroke-dasharray="40 30 6 30"/>
      <circle cx="982" cy="214" r="3" fill="#90e0ef"/>
      <animateTransform attributeName="transform" type="rotate" from="360 920 214" to="0 920 214" dur="9s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M890 186 V242 A30 9 0 0 0 950 242 V186" fill="url(#cyl)" stroke="#48cae4" stroke-opacity=".8"/>
      <path d="M890 205 A30 9 0 0 0 950 205 M890 224 A30 9 0 0 0 950 224" stroke="#48cae4" stroke-opacity=".6"/>
      <ellipse cx="920" cy="186" rx="30" ry="9" fill="#0e6ba8" stroke="#90e0ef"/>
      <ellipse cx="920" cy="186" rx="30" ry="9" fill="#caf0f8" fill-opacity="0">
        <animate attributeName="fill-opacity" values="0;.5;0" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <text class="tiny" x="920" y="300" text-anchor="middle">LAKEHOUSE</text>

    <!-- Output 1: bar chart -->
    <g>
      <rect x="1040" y="92" width="120" height="76" rx="10" fill="#0d1117" fill-opacity=".85" stroke="#21262d"/>
      <rect class="bar b1" x="1056" y="122" width="12" height="34" rx="2" fill="url(#barg)"/>
      <rect class="bar b2" x="1076" y="110" width="12" height="46" rx="2" fill="url(#barg)"/>
      <rect class="bar b3" x="1096" y="116" width="12" height="40" rx="2" fill="url(#barg)"/>
      <rect class="bar b4" x="1116" y="104" width="12" height="52" rx="2" fill="url(#barg)"/>
      <rect class="bar b5" x="1136" y="114" width="12" height="42" rx="2" fill="url(#barg)"/>
    </g>
    <!-- Output 2: line chart -->
    <g>
      <rect x="1040" y="262" width="120" height="76" rx="10" fill="#0d1117" fill-opacity=".85" stroke="#21262d"/>
      <path d="M1052 322 H1148" stroke="#21262d"/>
      <path class="line" d="M1054 318 L1072 304 L1090 310 L1108 290 L1126 296 L1146 278" stroke="#48cae4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1146" cy="278" r="3" fill="#caf0f8">
        <animate attributeName="r" values="2;4.5;2" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text class="tiny" x="1100" y="372" text-anchor="middle">INSIGHTS</text>

    <!-- ═════════ LEFT: IDENTITY (static) ═════════ -->
    <rect width="680" height="420" fill="url(#fadeR)"/>

    <rect x="72" y="118" width="44" height="3" rx="1.5" fill="#00b4d8"/>
    <text class="name" x="70" y="176">Lahiru Niroshan Sathsara</text>
    <text class="role" x="72" y="214">ORACLE DBA  ·  DATA ENGINEER  ·  PIPELINE ARCHITECT</text>
    <text class="desc" x="72" y="252">Building streaming pipelines and production data platforms,</text>
    <text class="desc" x="72" y="274">from banking-grade databases to real-time analytics.</text>

    <g>
      <rect x="72"  y="304" width="78"  height="28" rx="14" stroke="#00b4d8" stroke-opacity=".5" fill="#00b4d8" fill-opacity=".08"/>
      <text class="chip" x="111" y="322" text-anchor="middle">KAFKA</text>
      <rect x="160" y="304" width="78"  height="28" rx="14" stroke="#00b4d8" stroke-opacity=".5" fill="#00b4d8" fill-opacity=".08"/>
      <text class="chip" x="199" y="322" text-anchor="middle">SPARK</text>
      <rect x="248" y="304" width="86"  height="28" rx="14" stroke="#00b4d8" stroke-opacity=".5" fill="#00b4d8" fill-opacity=".08"/>
      <text class="chip" x="291" y="322" text-anchor="middle">ORACLE</text>
      <rect x="344" y="304" width="150" height="28" rx="14" stroke="#00b4d8" stroke-opacity=".5" fill="#00b4d8" fill-opacity=".08"/>
      <text class="chip" x="419" y="322" text-anchor="middle">OCI · AWS · AZURE</text>
    </g>
  </g>

  <rect x=".5" y=".5" width="1199" height="419" rx="18" stroke="#1f2a37"/>
</svg>
